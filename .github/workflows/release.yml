# Manual pre-release builds of the debug APK.
#
# The run starts by hand from the Actions tab, so every run builds and
# publishes: the person who pressed the button meant it.
#
# The version is calendar with a counter, YYYY.0M.0D.MICRO, see
# https://calver.org. MICRO starts at 0 for the first release of a day
# and grows with every release of that day, so a rerun adds a release
# instead of replacing one. The tag is the bare version.
#
# Each release is marked as a pre-release, and records the commit it
# was built from, so the next run can name the commits between the
# two. The run also lands the release as an entry in CHANGELOG.md,
# pushed to the default branch as a bot commit, so the branch must be
# pulled before work that follows a release is pushed.
name: Release

on:
  workflow_dispatch:

concurrency:
  group: release
  # A second run of the day must not cancel one that already started.
  cancel-in-progress: false

permissions:
  contents: write

env:
  APK: app/build/outputs/apk/debug/app-debug.apk

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the whole history
        uses: actions/checkout@v4
        with:
          # The release notes list the commits between two releases.
          fetch-depth: 0

      - name: Find the previous release
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          releases=$(gh api "repos/${{ github.repository }}/releases?per_page=100")
          latest=$(jq -r \
            '[.[] | select(.draft | not)] | sort_by(.created_at) | last // empty' \
            <<< "$releases")
          if [ -n "$latest" ]; then
            sha=$(jq -r '.target_commitish' <<< "$latest")
          else
            sha=""
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Work out the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          calver=$(date -u +%Y.%m.%d)
          # The counter of the day starts at 0, so the read takes the
          # highest one the releases of that day already carry. No
          # release of the day reads as -1, and the addition below
          # turns it into the first one.
          micro=$(gh api "repos/${{ github.repository }}/releases?per_page=100" \
            | jq -r --arg base "$calver" \
              '[.[] | select(.draft | not) | .tag_name
                | select(. != null)
                | select(startswith($base + "."))
                | capture("(?<n>[0-9]+)$").n
                | tonumber] | max // -1')
          micro=$((micro + 1))
          version="$calver.$micro"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "The release version is $version."

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Python for the interop test
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install the Python packages of the test server
        # The interop test launches tools/test_server.py, which needs both
        # packages. The runner image has neither guaranteed.
        run: python3 -m pip install cryptography "websockets~=17.0"

      - name: Prepare the Android SDK and its scratch folder
        run: |
          set -euo pipefail
          # AGP reads the SDK location from local.properties. The runner image
          # sets ANDROID_HOME, and the file is not in version control.
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          # The runner image carries recent SDK pieces. Install the two this
          # build needs when the image lags behind.
          sdkmanager_bin="$(command -v sdkmanager \
            || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          missing=()
          [ -d "$ANDROID_HOME/platforms/android-36" ] || missing+=("platforms;android-36")
          [ -d "$ANDROID_HOME/build-tools/36.0.0" ] || missing+=("build-tools;36.0.0")
          if [ ${#missing[@]} -gt 0 ]; then
            yes | "$sdkmanager_bin" --licenses > /dev/null || true
            "$sdkmanager_bin" --install "${missing[@]}" > /dev/null
          fi
          # The Android tools must not write their preferences to the home
          # folder. The local build does the same, see AGENTS.md.
          mkdir -p "$PWD/.android-home/.android"
          echo "ANDROID_PREFS_ROOT=$PWD/.android-home" >> "$GITHUB_ENV"

      - name: Run the JVM tests
        run: ./gradlew :sendspin:test :mass:test :app:test

      - name: Build the APK
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug \
            -Prelease.versionCode="$GITHUB_RUN_NUMBER" \
            -Prelease.versionName="${{ steps.version.outputs.version }}"

      - name: Hash the APK
        id: hash
        run: |
          set -euo pipefail
          sha=$(sha256sum "$APK" | cut -d' ' -f1)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "APK SHA-256: $sha"

      - name: Keep the APK as a run artifact
        uses: actions/upload-artifact@v4
        with:
          name: spindroid-release-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Publish the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          asset_name="spindroid-$version.apk"
          cp "$APK" "$asset_name"

          previous="${{ steps.previous.outputs.sha }}"
          if [ -n "$previous" ]; then
            range="$previous..${{ github.sha }}"
            # The range can be empty when the run landed without a new
            # commit, or when the history was rewritten. That is no
            # reason to stop the release. The bot that records the
            # changelog commits nothing but the changelog, and such a
            # commit says nothing about the product, so the lists leave
            # them out.
            commits=$(git log --oneline "$range" -- . ':(exclude)CHANGELOG.md' | head -n 50 || true)
            bullets=$(git log --pretty=format:'- `%h` %s' "$range" -- . ':(exclude)CHANGELOG.md' | head -n 50 || true)
            headline="Commits since the previous release (\`$range\`):"
          else
            range=""
            commits=$(git log --oneline -n 1)
            bullets=$(git log --pretty=format:'- `%h` %s' -n 1)
            headline="The first release build. Commit:"
          fi
          if [ -z "$bullets" ]; then
            # A manual run can land without a product commit in range.
            bullets="- No product commit since the previous release."
          fi
          {
            echo "Debug APK built from \`${{ github.sha }}\`."
            echo
            echo "$headline"
            echo
            echo '```'
            echo "$commits"
            echo '```'
            echo
            echo "APK SHA-256: \`${{ steps.hash.outputs.sha }}\`"
            echo
            echo "versionCode: ${{ github.run_number }}"
            echo "versionName: $version"
          } > release-notes.md

          # The changelog entry carries the same facts, in the file
          # format, for the next step to record.
          {
            echo "## $version — versionCode ${{ github.run_number }}, versionName $version"
            echo
            echo "Built from \`${{ github.sha }}\`."
            echo "APK SHA-256: \`${{ steps.hash.outputs.sha }}\`."
            echo
            echo "$headline"
            echo
            echo "$bullets"
          } > changelog-entry.md

          gh release create "$version" "$asset_name" \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "Pre-release $version" \
            --notes-file release-notes.md

      - name: Record the release in the changelog
        run: |
          set -euo pipefail
          python3 <<'PY'
          import sys

          entry = open("changelog-entry.md").read().rstrip("\n") + "\n\n"
          text = open("CHANGELOG.md").read()
          marker = "<!-- The release workflow inserts every new entry below this line. -->"
          if marker not in text:
              sys.exit("The marker line is missing from CHANGELOG.md.")

          # The entry goes under the marker, newest first, with one
          # blank line before it and one after it, whatever the file
          # carried before. Each version carries its own entry, so a
          # second release of the same day removes nothing.
          spot = text.index(marker) + len(marker)
          rest = text[spot:].lstrip("\n")
          open("CHANGELOG.md", "w").write(text[:spot] + "\n\n" + entry + rest)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "The changelog already carries this release."
            exit 0
          fi
          git commit -m "Record pre-release ${{ steps.version.outputs.version }} in the changelog"
          # The release stands even when the branch refuses the bot or
          # moved on; the next release records its own entry either way.
          git push origin HEAD:"${{ github.ref_name }}" || \
            echo "::warning::The changelog commit could not be pushed. Record it by hand."

      - name: Summarise the run
        if: always()
        run: |
          if [ "${{ job.status }}" != "success" ]; then
            echo "The run failed. Read the steps above."
          else
            echo "A new pre-release was published."
          fi
