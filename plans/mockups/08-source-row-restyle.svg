<svg xmlns="http://www.w3.org/2000/svg" width="400" height="920" font-family="Roboto, sans-serif">
  <rect width="400" height="860" fill="#e8eef6"/>

  <!-- Top bar -->
  <text x="24" y="48" font-size="18" font-weight="bold" fill="#1a1b1e">SpinDroid</text>
  <rect x="270" y="28" width="110" height="32" rx="16" fill="#283593"/>
  <text x="296" y="49" font-size="12" fill="#ffffff">Disconnect</text>

  <!-- Source card -->
  <rect x="16" y="66" width="368" height="470" rx="24" fill="#f0f4fa"/>
  <text x="34" y="100" font-size="15" fill="#5d6a78">Source</text>

  <!-- The + finder, right of the title -->
  <circle cx="322" cy="94" r="16" fill="#283593"/>
  <path d="M316 89 h12 M322 83 v12" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <text x="34" y="122" font-size="10" fill="#8a97a3">+ finds the installed media apps that hold no session</text>

  <!-- Row 1: TIDAL - picked (tinted row) and playing (bars, pause) -->
  <rect x="26" y="132" width="348" height="80" rx="40" fill="#d6e4ff"/>
  <rect x="44" y="154" width="36" height="36" rx="10" fill="#1b3a5c"/>
  <path d="M55 164 h4 v16 h-4 z M61 164 h4 v16 h-4 z M67 164 h4 v16 h-4 z" fill="#ffffff"/>
  <text x="90" y="166" font-size="15" font-weight="bold" fill="#1a1b1e">TIDAL</text>
  <text x="90" y="186" font-size="11" fill="#5d6a78">Belfast - Orbital</text>
  <g fill="#283593">
    <rect x="178" y="158" width="3" height="14"/>
    <rect x="184" y="154" width="3" height="18"/>
    <rect x="190" y="160" width="3" height="12"/>
  </g>
  <circle cx="248" cy="172" r="15" fill="#283593"/>
  <g fill="#ffffff">
    <rect x="242" y="165" width="4" height="14"/>
    <rect x="250" y="165" width="4" height="14"/>
  </g>

  <!-- Row 2: Spotify - playing, not picked -->
  <rect x="26" y="224" width="348" height="80" rx="40" fill="#f0f4fa"/>
  <rect x="44" y="246" width="36" height="36" rx="10" fill="#1db954"/>
  <path d="M54 258 q14 -6 24 2 M54 266 q12 -5 20 2 M55 273 q10 -4 16 2" stroke="#f0f4fa" stroke-width="3" fill="none" stroke-linecap="round"/>
  <text x="90" y="252" font-size="15" font-weight="bold" fill="#1a1b1e">Spotify</text>
  <g fill="#283593">
    <rect x="178" y="244" width="3" height="14"/>
    <rect x="184" y="240" width="3" height="18"/>
    <rect x="190" y="246" width="3" height="12"/>
  </g>
  <text x="90" y="274" font-size="11" fill="#5d6a78">S13 EP33: A couple of</text>
  <text x="90" y="289" font-size="11" fill="#5d6a78">bad pun machines</text>
  <circle cx="248" cy="264" r="15" fill="none" stroke="#283593" stroke-width="1.5"/>
  <g fill="#283593">
    <rect x="242" y="257" width="4" height="14"/>
    <rect x="250" y="257" width="4" height="14"/>
  </g>

  <!-- Row 3: BBC Sounds - paused, not picked -->
  <rect x="26" y="316" width="348" height="80" rx="40" fill="#f0f4fa"/>
  <rect x="44" y="346" width="36" height="36" rx="10" fill="#3f51b5"/>
  <text x="44" y="370" font-size="14" font-weight="bold" fill="#ffffff">B</text>
  <text x="90" y="350" font-size="15" font-weight="bold" fill="#1a1b1e">BBC Sounds</text>
  <text x="90" y="370" font-size="11" fill="#5d6a78">Vernon Kay, 09:30 - 12:00</text>
  <circle cx="248" cy="356" r="15" fill="none" stroke="#283593" stroke-width="1.5"/>
  <path d="M243 349 l12 7 -12 7 z" fill="#283593"/>

  <!-- Row 4: a discovered app, not running: dimmed, no transport -->
  <rect x="26" y="408" width="348" height="80" rx="40" fill="#e3e9ef"/>
  <rect x="44" y="438" width="36" height="36" rx="10" fill="#7986cb"/>
  <text x="44" y="462" font-size="14" font-weight="bold" fill="#ffffff">P</text>
  <text x="90" y="442" font-size="15" font-weight="bold" fill="#5d6a78">Prime Video</text>
  <text x="352" y="454" font-size="16" fill="#8a97a3">&#x2039;</text>
  <text x="352" y="470" font-size="16" fill="#8a97a3">&#x203A;</text>

  <!-- The discard reveal, mid-swipe -->
  <rect x="46" y="500" width="328" height="60" rx="40" fill="#d32f2f"/>
  <g stroke="#ffffff" stroke-width="2" fill="none">
    <rect x="330" y="516" width="12" height="22" rx="2"/>
    <path d="M325 516 h22 M333 516 v-4 h6 v4 M334 520 v12 M340 520 v12 M346 520 v12"/>
  </g>
  <text x="34" y="584" font-size="10" fill="#8a97a3">swipe a discovered row aside to discard it; the plus brings it back</text>

  <!-- The verbs key -->
  <text x="34" y="624" font-size="11" font-weight="bold" fill="#1a1b1e">The verbs</text>
  <g font-size="11" fill="#5d6a78">
    <text x="34" y="646">tap the row         pick: the capture carries this app</text>
    <text x="34" y="666">play / pause        the round button, per row</text>
    <text x="34" y="686">open the app        tap the icon on the left</text>
    <text x="34" y="706">discard             swipe a discovered row aside</text>
    <text x="34" y="726">follow the focus    no tap: the tint moves itself</text>
    <text x="34" y="746">drop a player       swipe a destination row aside</text>
  </g>
  <g font-size="11" fill="#5d6a78">
    <text x="34" y="756">tinted row = picked (being captured)</text>
    <text x="34" y="776">bars glyph  = playing now</text>
    <text x="34" y="796">dimmed row  = discovered, holds no session</text>
    <text x="34" y="816">session rows always win: they can never be discarded</text>
  </g>

  <!-- Bottom card stub, for context -->
  <rect x="16" y="836" width="368" height="60" rx="24" fill="#f0f4fa"/>
  <text x="34" y="868" font-size="15" fill="#5d6a78">Destination</text>
  <!-- The refresh control, right of the title: reads the list again, forgets the drops -->
  <circle cx="348" cy="862" r="16" fill="#283593"/>
  <path d="M348 853 a9 9 0 1 0 9 9" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M357 856 l-3 5.5 h6 z" fill="#ffffff"/>
  <text x="34" y="912" font-size="10" fill="#8a97a3">the refresh reads the player list again and forgets every drop</text>
</svg>
